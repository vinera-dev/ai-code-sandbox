name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -m "not docker"
      - run: docker build -t sbx-python:ci -f docker/Dockerfile docker
      - run: pytest -m docker tests/attacks tests/test_docker_runner.py tests/test_image.py tests/test_example.py
